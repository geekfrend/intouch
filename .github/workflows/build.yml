name: Build test app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InTouch-Lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InTouch-Lab
          path: InTouch-Lab.apk

      - name: Publish to the "test-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build InTouch-Lab.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "InTouch Lab - test build #${{ github.run_number }}" \
            --notes "On your phone, download InTouch-Lab.apk below and open it to install. Built from ${{ github.sha }}."
