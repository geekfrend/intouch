name: Build InTouch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download fonts (Josefin Sans, Nunito Sans)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-fonts.sh

      - name: Run unit tests and build the APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # Compiler and resource errors also become annotations, so they show up without opening the full log.
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|ERROR:|What went wrong|FAILED|Exception" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InTouch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InTouch
          path: InTouch.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InTouch.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "InTouch - build #${{ github.run_number }}" \
            --notes "On your phone, download InTouch.apk below and open it to install. New builds install over the old one. Built from ${{ github.sha }}."
